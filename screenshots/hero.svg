<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480">
  <title>supabase_realtime_push: push notifications on Android without Firebase</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1324"/>
      <stop offset="1" stop-color="#131F3A"/>
    </linearGradient>
    <radialGradient id="glow" cx="965" cy="250" r="330" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#34D399" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#34D399" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#1C2A47"/>
    </pattern>
    <linearGradient id="db" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22355F"/>
      <stop offset="1" stop-color="#18264A"/>
    </linearGradient>
    <marker id="head-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#FBBF24"/>
    </marker>
    <marker id="head-sky" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#7DD3FC"/>
    </marker>
  </defs>

  <rect width="1280" height="480" fill="url(#bg)"/>
  <rect width="1280" height="480" fill="url(#dots)"/>
  <rect width="1280" height="480" fill="url(#glow)"/>

  <!-- Text -->
  <g font-family="'Red Hat Display', 'Red Hat Text', 'Noto Sans', sans-serif">
    <text x="72" y="146" font-family="'Red Hat Mono', 'DejaVu Sans Mono', monospace" font-size="15" font-weight="600" letter-spacing="2.5" fill="#34D399">FLUTTER PLUGIN · ANDROID</text>
    <text x="72" y="206" font-size="48" font-weight="800" fill="#F8FAFC">supabase_realtime_push</text>
    <text x="72" y="254" font-family="'Red Hat Text', sans-serif" font-size="24" font-weight="600" fill="#CBD5E1">Push notifications on Android, without Firebase.</text>
    <text font-family="'Red Hat Text', sans-serif" font-size="18" fill="#94A3B8">
      <tspan x="72" y="296">One open connection, an empty signal, and a</tspan>
      <tspan x="72" y="322">notification shade that always matches your database.</tspan>
    </text>
  </g>

  <!-- Chips -->
  <g font-family="'Red Hat Text', sans-serif" font-size="15" font-weight="600" fill="#E2E8F0">
    <rect x="72" y="356" width="104" height="36" rx="18" fill="#15223D" stroke="#2B3D60"/>
    <circle cx="94" cy="374" r="4" fill="#34D399"/>
    <text x="106" y="379">No FCM</text>
    <rect x="188" y="356" width="216" height="36" rx="18" fill="#15223D" stroke="#2B3D60"/>
    <circle cx="210" cy="374" r="4" fill="#34D399"/>
    <text x="222" y="379">Works without Google</text>
    <rect x="416" y="356" width="196" height="36" rx="18" fill="#15223D" stroke="#2B3D60"/>
    <circle cx="438" cy="374" r="4" fill="#34D399"/>
    <text x="450" y="379">Cloud or self-hosted</text>
  </g>

  <!-- Database -->
  <g>
    <path d="M740 222 V338 A60 16 0 0 0 860 338 V222" fill="url(#db)" stroke="#60A5FA" stroke-width="2.5"/>
    <path d="M740 261 A60 16 0 0 0 860 261 M740 300 A60 16 0 0 0 860 300" fill="none" stroke="#60A5FA" stroke-width="2" opacity="0.55"/>
    <ellipse cx="800" cy="222" rx="60" ry="16" fill="#2B4378" stroke="#60A5FA" stroke-width="2.5"/>
    <text x="800" y="388" text-anchor="middle" font-family="'Red Hat Mono', monospace" font-size="15" fill="#94A3B8">your database</text>
  </g>

  <!-- Signal: database rings the doorbell -->
  <path d="M866 252 C 920 252, 950 206, 1018 206" fill="none" stroke="#FBBF24" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round" marker-end="url(#head-amber)"/>
  <!-- Snapshot: the phone reads the full list -->
  <path d="M866 318 H 1018" fill="none" stroke="#7DD3FC" stroke-width="3" stroke-linecap="round" marker-end="url(#head-sky)"/>
  <g font-family="'Red Hat Mono', monospace" font-size="14" font-weight="600" text-anchor="middle">
    <rect x="902" y="217" width="88" height="26" rx="13" fill="#2A2412" stroke="#FBBF24" stroke-opacity="0.6"/>
    <text x="946" y="235" fill="#FCD34D">changed</text>
    <rect x="898" y="305" width="96" height="26" rx="13" fill="#102B3D" stroke="#7DD3FC" stroke-opacity="0.6"/>
    <text x="946" y="323" fill="#BAE6FD">snapshot</text>
  </g>

  <!-- Doorbell -->
  <g>
    <circle cx="946" cy="128" r="38" fill="#2A2412" stroke="#FBBF24" stroke-width="2" stroke-opacity="0.7"/>
    <path d="M928 146 C 931 140, 931 133, 931 126 C 931 114, 937 106, 946 106 C 955 106, 961 114, 961 126 C 961 133, 961 140, 964 146 Z" fill="#FBBF24"/>
    <rect x="924" y="145" width="44" height="6" rx="3" fill="#FBBF24"/>
    <circle cx="946" cy="157" r="5" fill="#FBBF24"/>
    <circle cx="946" cy="103" r="3.5" fill="#FBBF24"/>
    <g fill="none" stroke="#FBBF24" stroke-width="3" stroke-linecap="round">
      <path d="M900 102 A52 52 0 0 0 900 154" opacity="0.85"/>
      <path d="M992 102 A52 52 0 0 1 992 154" opacity="0.85"/>
      <path d="M890.6 96 A64 64 0 0 0 890.6 160" opacity="0.4"/>
      <path d="M1001.4 96 A64 64 0 0 1 1001.4 160" opacity="0.4"/>
    </g>
  </g>

  <!-- Phone -->
  <g>
    <rect x="1030" y="62" width="176" height="352" rx="30" fill="#0D1628" stroke="#53627C" stroke-width="3"/>
    <rect x="1041" y="73" width="154" height="330" rx="21" fill="#121D35"/>
    <circle cx="1118" cy="88" r="4.5" fill="#2B3A55"/>
    <text x="1056" y="93" font-family="'Red Hat Text', sans-serif" font-size="12" font-weight="600" fill="#94A3B8">9:41</text>

    <!-- New: alerts -->
    <rect x="1051" y="116" width="134" height="62" rx="12" fill="#1A2742" stroke="#34D399" stroke-width="2"/>
    <circle cx="1071" cy="147" r="10" fill="#34D399"/>
    <rect x="1089" y="134" width="80" height="9" rx="4.5" fill="#E2E8F0"/>
    <rect x="1089" y="150" width="58" height="7" rx="3.5" fill="#64748B"/>
    <circle cx="1183" cy="118" r="7" fill="#34D399" stroke="#121D35" stroke-width="3"/>

    <!-- Changed: updates quietly -->
    <rect x="1051" y="190" width="134" height="62" rx="12" fill="#1A2742" stroke="#2F3F5E" stroke-width="1.5"/>
    <circle cx="1071" cy="221" r="10" fill="#818CF8"/>
    <rect x="1089" y="208" width="70" height="9" rx="4.5" fill="#CBD5E1"/>
    <rect x="1089" y="224" width="64" height="7" rx="3.5" fill="#64748B"/>

    <!-- Gone: disappears -->
    <g opacity="0.45">
      <rect x="1051" y="264" width="134" height="62" rx="12" fill="none" stroke="#53627C" stroke-width="1.5" stroke-dasharray="5 5"/>
      <circle cx="1071" cy="295" r="10" fill="none" stroke="#53627C" stroke-width="1.5"/>
      <rect x="1089" y="282" width="62" height="9" rx="4.5" fill="#334155"/>
      <rect x="1089" y="298" width="44" height="7" rx="3.5" fill="#334155"/>
    </g>

    <rect x="1090" y="388" width="56" height="5" rx="2.5" fill="#2B3A55"/>
    <text x="1118" y="446" text-anchor="middle" font-family="'Red Hat Mono', monospace" font-size="15" fill="#94A3B8">your app</text>
  </g>
</svg>
