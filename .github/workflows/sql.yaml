name: sql

on:
  push:
    branches: [main]
    paths:
      - supabase/**
      - tool/test_sql.sh
      - .github/workflows/sql.yaml
  pull_request:
    branches: [main]
    paths:
      - supabase/**
      - tool/test_sql.sh
      - .github/workflows/sql.yaml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sql:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run the SQL tests on Postgres 17
        run: tool/test_sql.sh
