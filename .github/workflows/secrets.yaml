# GitHub does not offer secret scanning or push protection on a private
# personal repository, so gitleaks scans every commit a PR brings in (and each
# push to main) until the repository is public and those turn on (#7).
# Personal accounts need no GITLEAKS_LICENSE.
name: secrets

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secrets:
    name: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # lists the PR's commits on a private repository
    steps:
      # The whole history: gitleaks scans the PR's commit range, not only HEAD.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Commenting needs pull-requests: write; the job summary and the
          # failed check already say what leaked and where.
          GITLEAKS_ENABLE_COMMENTS: false
