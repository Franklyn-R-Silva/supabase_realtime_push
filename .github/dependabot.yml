version: 2

updates:
  # The workflows pin every action to a commit SHA, and a SHA ages silently.
  # Dependabot bumps the SHA and its `# vX.Y.Z` comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # A hijacked release is usually pulled within days; waiting a week keeps it
    # out of the PR. Security updates skip the wait.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
    labels:
      - dependencies
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: pub
    directories:
      - /
      - /example
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
    labels:
      - dependencies
    groups:
      pub-dependencies:
        patterns:
          - "*"

  # The native side's own dependencies (OkHttp and the test libraries).
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
    labels:
      - dependencies
    groups:
      gradle-dependencies:
        patterns:
          - "*"
