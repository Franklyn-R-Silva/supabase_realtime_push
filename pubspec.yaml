name: supabase_realtime_push
description: >-
  Push notifications on Android without Firebase: a native service holds one
  Supabase Realtime connection and shows the notifications your database lists.
version: 0.0.1
repository: https://github.com/Franklyn-R-Silva/supabase_realtime_push
issue_tracker: https://github.com/Franklyn-R-Silva/supabase_realtime_push/issues
# Private until the first release: this stops an accidental `pub publish`.
# Remove it in the go-public checklist, together with the CI publish dry-run.
publish_to: none
screenshots:
  - description: >-
      Your database rings an empty doorbell over Supabase Realtime, and the
      phone fetches the snapshot that its notification shade then matches.
    path: screenshots/hero.png
topics:
  - supabase
  - push-notifications
  - notifications
  - realtime
  - android

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=5.0.0 <7.0.0"

flutter:
  plugin:
    platforms:
      android:
        package: dev.devfrs.supabase_realtime_push
        pluginClass: SupabaseRealtimePushPlugin
